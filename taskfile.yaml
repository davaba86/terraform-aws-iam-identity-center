---
version: 3

env:
  tag: v1.0.0

tasks:
  gh-move-tag:
    desc: Move a git tag to the latest commit on the main branch and push it to the remote repository.
    cmds:
      - |
        echo "Moving tag {{.tag}} to the latest commit on the main branch and pushing it to the remote repository..."

        git checkout main
        git pull

        git tag -f "{{.tag}}"
        git push origin "{{.tag}}" --force
